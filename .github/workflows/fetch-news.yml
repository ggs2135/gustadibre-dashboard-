name: Fetch News

on:
  schedule:
    # 07:00 UTC daily — adjust to your timezone preference.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - run: npm run fetch-news

      - name: Commit updated briefing
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update daily news briefing"
          file_pattern: public/news.json
